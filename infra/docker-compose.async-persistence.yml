# Local PostgreSQL + Redis for async node enrichment (INFRA-050, INFRA-053, INFRA-054).
# Usage (from neocom-meta):
#   docker compose -f infra/docker-compose.async-persistence.yml up -d
#
# Nest (neocom-back) connects with DATABASE_URL / REDIS_URL from .env.async (see docs).
# Schema and migrations live in neocom-back (INFRA-053).

services:
  postgres:
    image: postgres:16-alpine
    container_name: neocom-async-postgres
    environment:
      POSTGRES_USER: neocom
      POSTGRES_PASSWORD: neocom
      POSTGRES_DB: neocom_async
    ports:
      - '5432:5432'
    volumes:
      - neocom_async_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neocom -d neocom_async']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neocom-async-redis
    ports:
      - '6379:6379'
    volumes:
      - neocom_async_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neocom_async_pg:
  neocom_async_redis:
