# Programme mirror of neocom-back/tools/docker/docker-compose.yml (INFRA-050…054).
# Prefer the back stack for local Nest work:
#   cd neocom-back && npm run docker:up
#
# Usage from neocom-meta (same credentials/ports):
#   docker compose -f infra/docker-compose.async-persistence.yml up -d
#
# Nest connects with DATABASE_URL / REDIS_URL from neocom-back/.env.async.
# Schema and migrations live in neocom-back (INFRA-053).

services:
  postgres:
    image: postgres:16-alpine
    container_name: neocom-async-postgres
    environment:
      POSTGRES_USER: neocom
      POSTGRES_PASSWORD: neocom
      POSTGRES_DB: neocom_async
    ports:
      # Host 6003 (dev-watch: front 6001, back 6002, postgres 6003).
      - '6003:5432'
    volumes:
      - neocom_async_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neocom -d neocom_async']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neocom-async-redis
    ports:
      # Host 6004 (next after postgres 6003).
      - '6004:6379'
    volumes:
      - neocom_async_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neocom_async_pg:
  neocom_async_redis:
