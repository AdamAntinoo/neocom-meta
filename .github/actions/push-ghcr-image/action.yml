name: Build and push GHCR image
description: Build a Docker image and push :imageTag and :latest to ghcr.io.
inputs:
  artifact-name:
    description: Short image name (e.g. neocom-front)
    required: true
  image-tag:
    description: Full imageTag from gitversion action
    required: true
  context:
    description: Docker build context path
    required: false
    default: .
  dockerfile:
    description: Dockerfile path
    required: false
    default: Dockerfile
runs:
  using: composite
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build and push
      shell: bash
      run: |
        set -euo pipefail
        OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
        IMAGE="ghcr.io/${OWNER}/${{ inputs.artifact-name }}"
        TAG="${{ inputs.image-tag }}"
        docker build -f "${{ inputs.dockerfile }}" -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" "${{ inputs.context }}"
        docker push "${IMAGE}:${TAG}"
        docker push "${IMAGE}:latest"
        echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
