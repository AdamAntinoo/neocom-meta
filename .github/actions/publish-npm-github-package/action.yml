name: Publish npm package to GitHub Packages
description: >-
  Stage a production Node package and publish it to GitHub Packages
  (npm.pkg.github.com). Does not mutate the repo package.json (kept private /
  0.0.0 for cache). Supports spa (front dist + server) and nest (back dist).
inputs:
  package-name:
    description: Unscoped package short name (e.g. neocom-front)
    required: true
  version:
    description: SemVer / commitTag from gitversion
    required: true
  layout:
    description: Package layout — spa (default) or nest
    required: false
    default: spa
  dist-path:
    description: Built output directory relative to workspace
    required: false
    default: dist/neocom-front
  server-file:
    description: SPA layout — production Node server entry
    required: false
    default: server.js
  config-dir:
    description: SPA layout — runtime config directory
    required: false
    default: config
runs:
  using: composite
  steps:
    - name: Stage and publish GitHub npm package
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
        NAME="${{ inputs.package-name }}"
        VERSION="${{ inputs.version }}"
        LAYOUT="${{ inputs.layout }}"
        SCOPE="@${OWNER}"
        FULL_NAME="${SCOPE}/${NAME}"
        DIST="${{ inputs.dist-path }}"
        SERVER="${{ inputs.server-file }}"
        CONFIG="${{ inputs.config-dir }}"

        if [[ ! -d "$DIST" ]]; then
          echo "::error::Missing dist at ${DIST}"
          exit 1
        fi

        STAGING="$(mktemp -d)"
        mkdir -p "${STAGING}/${DIST}"
        cp -R "${DIST}/." "${STAGING}/${DIST}/"

        if [[ "$LAYOUT" == "nest" ]]; then
          STAGING_DIR="$STAGING" PKG_NAME="$FULL_NAME" PKG_VERSION="$VERSION" DIST_PATH="$DIST" PKG_LAYOUT=nest \
            node <<'NODE'
        const fs = require('fs');
        const path = require('path');
        const staging = process.env.STAGING_DIR;
        const fullName = process.env.PKG_NAME;
        const version = process.env.PKG_VERSION;
        const distPath = process.env.DIST_PATH;
        const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const pkg = {
          name: fullName,
          version,
          description: 'NEOCOM Back production Nest build',
          private: false,
          type: rootPkg.type || 'module',
          main: `${distPath}/main.js`,
          files: [distPath],
          imports: rootPkg.imports,
          scripts: {
            start: `node ${distPath}/main.js`,
          },
          engines: rootPkg.engines || undefined,
          license: rootPkg.license,
          dependencies: rootPkg.dependencies || {},
          publishConfig: {
            registry: 'https://npm.pkg.github.com',
          },
          repository: {
            type: 'git',
            url: `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
          },
        };
        fs.writeFileSync(path.join(staging, 'package.json'), JSON.stringify(pkg, null, 2) + '\n');
        NODE
        else
          if [[ ! -f "$SERVER" ]]; then
            echo "::error::Missing server file ${SERVER}"
            exit 1
          fi
          if [[ ! -d "$CONFIG" ]]; then
            echo "::error::Missing config dir ${CONFIG}"
            exit 1
          fi
          cp "$SERVER" "${STAGING}/"
          cp -R "${CONFIG}" "${STAGING}/config"

          STAGING_DIR="$STAGING" PKG_NAME="$FULL_NAME" PKG_VERSION="$VERSION" DIST_PATH="$DIST" \
            node <<'NODE'
        const fs = require('fs');
        const path = require('path');
        const staging = process.env.STAGING_DIR;
        const fullName = process.env.PKG_NAME;
        const version = process.env.PKG_VERSION;
        const distPath = process.env.DIST_PATH;
        const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const runtimeDeps = [
          'compression',
          'dotenv',
          'express',
          'http-proxy-middleware',
        ];
        const dependencies = {};
        for (const dep of runtimeDeps) {
          if (!rootPkg.dependencies?.[dep]) {
            throw new Error(`Missing runtime dependency ${dep} in package.json`);
          }
          dependencies[dep] = rootPkg.dependencies[dep];
        }
        const pkg = {
          name: fullName,
          version,
          description: 'NEOCOM Front production dist (static + Node server)',
          private: false,
          main: 'server.js',
          files: [distPath, 'server.js', 'config'],
          scripts: {
            start: 'node server.js',
          },
          engines: rootPkg.engines || undefined,
          dependencies,
          publishConfig: {
            registry: 'https://npm.pkg.github.com',
          },
          repository: {
            type: 'git',
            url: `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
          },
        };
        fs.writeFileSync(path.join(staging, 'package.json'), JSON.stringify(pkg, null, 2) + '\n');
        NODE
        fi

        {
          echo "@${OWNER}:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
        } > "${STAGING}/.npmrc"

        echo "Publishing ${FULL_NAME}@${VERSION} (layout=${LAYOUT}) to GitHub Packages…"
        if NPM_CONFIG_USERCONFIG="${STAGING}/.npmrc" \
          npm view "${FULL_NAME}@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
          echo "Already published ${FULL_NAME}@${VERSION} — skip"
        else
          # npm refuses the default "latest" dist-tag for SemVer prereleases
          # (e.g. 0.0.1-feature-cicd.abc1234 from gitversion commitTag).
          PUBLISH_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            REF_NAME="$(echo "${GITHUB_REF_NAME:-}" | tr '[:upper:]' '[:lower:]')"
            case "$REF_NAME" in
              feature/*) DIST_TAG=feature ;;
              develop) DIST_TAG=dev ;;
              fix/*) DIST_TAG=fix ;;
              hotfix/*) DIST_TAG=hotfix ;;
              release/*) DIST_TAG=release ;;
              *) DIST_TAG=ci ;;
            esac
            PUBLISH_ARGS+=(--tag "$DIST_TAG")
            echo "Prerelease version — using npm dist-tag ${DIST_TAG}"
          fi
          (cd "$STAGING" && npm publish "${PUBLISH_ARGS[@]}")
          echo "Published ${FULL_NAME}@${VERSION}"
        fi
