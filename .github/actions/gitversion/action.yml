name: GitVersion version
description: >-
  Get the correct version from the GitVersion process and return the calculated
  version names and tags. Only merges to main will use the majorMinorPatch.

outputs:
  majorMinorPatch:
    description: The majorMinorPatch version string.
    value: ${{ steps.export_tags.outputs.majorMinorPatch }}
  commitTag:
    description: The tag version for this commit. It is the major-minor-patch version.
    value: ${{ steps.export_tags.outputs.commitTag }}
  imageTag:
    description: The image version to be generated for docker image.
    value: ${{ steps.export_tags.outputs.imageTag }}
  appVersion:
    description: >-
      The application version label to be used to identify the deployed revision
      at the infrastructure environment.
    value: ${{ steps.export_tags.outputs.appVersion }}

runs:
  using: composite
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.1.11
      with:
        versionSpec: '6.0.x'
        preferLatestVersion: true
    - name: Determine Version
      id: version_step
      uses: gittools/actions/gitversion/execute@v3.1.11
    - name: Publish calculated versions
      id: export_tags
      shell: bash
      run: |
        set -euo pipefail
        echo ">>> Versions"
        echo "majorMinorPatch=${{ env.majorMinorPatch }}" >> "$GITHUB_OUTPUT"
        if [[ "${{ env.branchName }}" == "main" || "${{ env.branchName }}" == "master" ]]; then
          echo "commitTag=${{ env.majorMinorPatch }}" >> "$GITHUB_OUTPUT"
          echo "imageTag=${{ env.majorMinorPatch }}" >> "$GITHUB_OUTPUT"
          echo "appVersion=$(echo '${{ env.majorMinorPatch }}' | tr '[:upper:]' '[:lower:]' | tr '+' '.' | tr '.' '_')" >> "$GITHUB_OUTPUT"
        else
          echo "commitTag=${{ env.majorMinorPatch }}${{ env.preReleaseLabelWithDash }}.${{ env.shortSha }}" >> "$GITHUB_OUTPUT"
          echo "imageTag=$(echo '${{ env.majorMinorPatch }}${{ env.preReleaseLabelWithDash }}.${{ env.shortSha }}' | tr '[:upper:]' '[:lower:]' | tr '+' '-')" >> "$GITHUB_OUTPUT"
          echo "appVersion=$(echo '${{ env.majorMinorPatch }}${{ env.preReleaseLabelWithDash }}.${{ env.shortSha }}' | tr '[:upper:]' '[:lower:]' | tr '+' '.' | tr '.' '_')" >> "$GITHUB_OUTPUT"
        fi

        echo "MajorMinorPatch (env.majorMinorPatch)  : ${{ env.majorMinorPatch }}"
        echo "SemVer (env.semVer)                    : ${{ env.semVer }}"
        echo "FullSemVer (env.fullSemVer)            : ${{ env.fullSemVer }}"
        if [[ "${{ env.branchName }}" == "main" || "${{ env.branchName }}" == "master" ]]; then
          echo "Commit Tag                           : ${{ env.majorMinorPatch }}"
          echo "Image Tag                            : ${{ env.majorMinorPatch }}"
          echo "Application Version                  : $(echo '${{ env.majorMinorPatch }}' | tr '[:upper:]' '[:lower:]' | tr '+' '.' | tr '.' '_')"
        else
          echo "Commit Tag                           : ${{ env.majorMinorPatch }}${{ env.preReleaseLabelWithDash }}.${{ env.shortSha }}"
          echo "Image Tag                            : $(echo '${{ env.majorMinorPatch }}${{ env.preReleaseLabelWithDash }}.${{ env.shortSha }}' | tr '[:upper:]' '[:lower:]' | tr '+' '-')"
          echo "Application Version                  : $(echo '${{ env.majorMinorPatch }}${{ env.preReleaseLabelWithDash }}.${{ env.shortSha }}' | tr '[:upper:]' '[:lower:]' | tr '+' '.' | tr '.' '_')"
        fi
        echo "<<<"
