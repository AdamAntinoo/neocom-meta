name: GitVersion version
description: >-
  Compute MajorMinorPatch, imageTag, and commitTag for NEOCOM front/back.
  imageTag is always {majorMinorPatch}-{commits}.{channel}.{shortSha}.
  On main/master, commitTag is majorMinorPatch; otherwise commitTag equals imageTag.
outputs:
  majorMinorPatch:
    description: MajorMinorPatch (X.Y.Z)
    value: ${{ steps.export_tags.outputs.majorMinorPatch }}
  commitTag:
    description: Package/app version for this commit
    value: ${{ steps.export_tags.outputs.commitTag }}
  imageTag:
    description: Docker/GHCR tag
    value: ${{ steps.export_tags.outputs.imageTag }}
  appVersion:
    description: Infrastructure-friendly label
    value: ${{ steps.export_tags.outputs.appVersion }}
runs:
  using: composite
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '5.12.x'
        preferLatestVersion: true
    - name: Determine Version
      id: version_step
      uses: gittools/actions/gitversion/execute@v4.7.0
    - name: Publish calculated versions
      id: export_tags
      shell: bash
      run: |
        set -euo pipefail
        REF_NAME="$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]')"
        SHORT_SHA="$(echo '${{ steps.version_step.outputs.shortSha }}' | tr '[:upper:]' '[:lower:]')"
        COMMITS='${{ steps.version_step.outputs.commitsSinceVersionSource }}'
        MMP='${{ steps.version_step.outputs.majorMinorPatch }}'
        case "$REF_NAME" in
          main|master) CHANNEL=release ;;
          feature/*) CHANNEL=feature ;;
          develop) CHANNEL=dev ;;
          fix/*) CHANNEL=fix ;;
          hotfix/*) CHANNEL=hotfix ;;
          release/*) CHANNEL=release ;;
          *)
            CHANNEL="$(echo "$REF_NAME" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed 's/--*/-/g; s/^-//; s/-$//')"
            [[ -z "$CHANNEL" ]] && CHANNEL=other
            ;;
        esac
        IMAGE_TAG="${MMP}-${COMMITS}.${CHANNEL}.${SHORT_SHA}"
        if [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
          COMMIT_TAG="$MMP"
        else
          COMMIT_TAG="$IMAGE_TAG"
        fi
        APP_VERSION="$(echo "$IMAGE_TAG" | tr '+' '.' | tr '.' '_')"
        echo "majorMinorPatch=${MMP}" >> "$GITHUB_OUTPUT"
        echo "commitTag=${COMMIT_TAG}" >> "$GITHUB_OUTPUT"
        echo "imageTag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "appVersion=${APP_VERSION}" >> "$GITHUB_OUTPUT"
        echo "MajorMinorPatch=${MMP} commitTag=${COMMIT_TAG} imageTag=${IMAGE_TAG}"
