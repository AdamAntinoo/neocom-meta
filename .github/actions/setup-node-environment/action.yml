name: Setup Node environment
description: >-
  Install Node.js and restore node_modules from cache when package.json (and the
  lockfile) are unchanged. Only runs a full install when the cache misses or
  node_modules is absent — so start:server / build always have dependencies.
inputs:
  node-version:
    description: Node.js version to install. The local nvm alias neocom is not a version GitHub can download.
    required: true
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        # Speeds registry downloads when a full install is still required.
        cache: npm
        # Keep our explicit node_modules cache; avoid setup-node v5 auto packageManager cache.
        package-manager-cache: false

    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        # Exact key only (no restore-keys) so we never skip install on a partial/wrong tree.
        # package.json version stays 0.0.0 so SemVer sync does not bust this key.
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}

    - name: Install dependencies if node_modules missing
      shell: bash
      run: |
        set -euo pipefail
        if [[ -d node_modules && -d node_modules/.bin ]]; then
          echo "node_modules present (cache-hit=${{ steps.cache-node-modules.outputs.cache-hit }}) — skipping install"
          exit 0
        fi
        echo "node_modules missing — running full install (cache-hit=${{ steps.cache-node-modules.outputs.cache-hit }})"
        if [[ -f package-lock.json ]]; then
          npm ci
        else
          npm install
        fi
