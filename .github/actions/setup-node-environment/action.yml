name: Setup Node environment
description: Install a Node.js version and the npm dependencies from the lockfile.
inputs:
  node-version:
    description: Node.js version to install. The local nvm alias neocom is not a version GitHub can download.
    required: true
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
