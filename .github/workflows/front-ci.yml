# Called by neocom-front. Does not run on commits to neocom-meta.
# Stages: setup → lint → (unit ‖ acceptance) → sonar → publish Packages → GHCR image.
name: Front CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (must match .nvmrc / engines)
        required: true
        type: string
      artifact-name:
        description: GHCR short image name
        required: false
        type: string
        default: neocom-front
      sonar-project-key:
        description: SonarCloud project key
        required: false
        type: string
        default: AdamAntinoo_neocom-front
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: AdamAntinoo/neocom-meta/.github/actions/setup-node-environment@feature/cicd
        with:
          node-version: ${{ inputs.node-version }}
      - uses: AdamAntinoo/neocom-meta/.github/actions/front-lint@feature/cicd

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: AdamAntinoo/neocom-meta/.github/actions/setup-node-environment@feature/cicd
        with:
          node-version: ${{ inputs.node-version }}
      - uses: AdamAntinoo/neocom-meta/.github/actions/front-unit-test@feature/cicd
      - uses: actions/upload-artifact@v4
        with:
          name: front-coverage
          path: coverage
          if-no-files-found: warn

  acceptance:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: AdamAntinoo/neocom-meta/.github/actions/setup-node-environment@feature/cicd
        with:
          node-version: ${{ inputs.node-version }}
      - name: Production build (no live neocom-back)
        uses: AdamAntinoo/neocom-meta/.github/actions/front-production-build@feature/cicd
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      - name: Ensure Cypress binary
        run: npx cypress install
      - name: Start WireMock and front (Docker)
        run: |
          set -euo pipefail
          docker network create neocom-bdd >/dev/null
          docker run -d --name wiremock --network neocom-bdd \
            -p 8080:8080 \
            -v "$PWD/support/wiremock:/home/wiremock" \
            wiremock/wiremock:3.13.1
          docker build -t neocom-front:bdd .
          docker run -d --name neocom-front-bdd --network neocom-bdd \
            -p 6001:6001 \
            -e PORT=6001 \
            -e WIREMOCK_URL=http://wiremock:8080 \
            neocom-front:bdd
          echo "Waiting for front container on :6001…"
          # wait-on defaults to HEAD; Express SPA fallback is GET-only → use http-get.
          # localhost (not 127.0.0.1) — must match EVE SSO redirectUri / Cypress origin.
          npx --yes wait-on http-get://localhost:6001/app/ -t 120000
          docker logs neocom-front-bdd 2>&1 | tail -30
      - name: Cypress acceptance
        run: npm run test:bdd:run
        env:
          CYPRESS_baseUrl: http://localhost:6001
          BDD_EXTERNAL_SERVERS: "1"
      - name: Stop WireMock and front containers
        if: always()
        run: |
          docker rm -f neocom-front-bdd wiremock 2>/dev/null || true
          docker network rm neocom-bdd 2>/dev/null || true

  sonar:
    needs: [unit, acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: AdamAntinoo/neocom-meta/.github/actions/setup-node-environment@feature/cicd
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: front-coverage
          path: coverage
        continue-on-error: true
      - uses: AdamAntinoo/neocom-meta/.github/actions/sonar-scan@feature/cicd
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          project-key: ${{ inputs.sonar-project-key }}

  publish:
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: AdamAntinoo/neocom-meta/.github/actions/setup-node-environment@feature/cicd
        with:
          node-version: ${{ inputs.node-version }}
      - uses: AdamAntinoo/neocom-meta/.github/actions/gitversion@feature/cicd
        id: gv
      - name: Production build
        uses: AdamAntinoo/neocom-meta/.github/actions/front-production-build@feature/cicd
      - name: Upload dist package artifact
        uses: actions/upload-artifact@v4
        with:
          name: neocom-front-dist-${{ steps.gv.outputs.commitTag }}
          path: dist/neocom-front
          if-no-files-found: error
      - name: Create annotated version tag on main
        if: github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.gv.outputs.majorMinorPatch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" || true
          git push origin "refs/tags/$TAG" || true
      - name: Build and push GHCR image
        uses: AdamAntinoo/neocom-meta/.github/actions/push-ghcr-image@feature/cicd
        with:
          artifact-name: ${{ inputs.artifact-name }}
          image-tag: ${{ steps.gv.outputs.imageTag }}
